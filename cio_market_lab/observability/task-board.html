<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任務觀測台</title><link rel="stylesheet" href="/task-board.css"></head><body><header><h1>任務觀測台</h1><p>唯讀 · 來源狀態與執行狀態分開顯示</p><div id="updated" role="status">尚未更新</div></header><main><section id="summary" aria-label="任務摘要"></section><nav aria-label="檢視"><button data-view="tasks">任務</button><button data-view="roadmap">路線圖</button><button data-view="changes">最近活動</button></nav><div id="errors" role="alert"></div><div class="controls"><label>搜尋 <input id="search" type="search" placeholder="任務 ID 或名稱"></label><label>狀態 <select id="status"><option value="">全部</option><option value="RUNNING">執行中</option><option value="SCHEDULED">已排程</option><option value="BLOCKED">阻塞</option><option value="DONE">完成待驗收</option></select></label><label>專案 <select id="project"><option value="">全部</option></select></label></div><section id="content" aria-live="polite"></section></main><script src="/task-board.js" defer></script></body></html>
