name: Browser regression

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: browser-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: chromium
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CIO_BROWSER_TESTS: "1"
      CIO_MARKET_LAB_OFFLINE: "1"
      HERMES_OFFLINE: "1"
      BROWSER_EVIDENCE_DIR: artifacts/browser
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: vendor/shioaji-pro-app
        run: npm ci --ignore-scripts

      - name: Build frontend SPA
        working-directory: vendor/shioaji-pro-app
        run: npm run build

      - name: Install backend and browser dependencies
        run: python -m pip install -e '.[test,browser]'

      - name: Install pinned Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run workstation browser smoke
        run: python -m pytest -q tests/browser/test_workstation_smoke.py

      - name: Run paper order browser flows
        run: python -m pytest -q tests/browser/test_paper_order_flows.py

      - name: Upload sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence
          path: artifacts/browser
          if-no-files-found: error
          retention-days: 7
