name: Source regression

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: source-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vendor/shioaji-pro-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: vendor/shioaji-pro-app
        run: npm ci --ignore-scripts

      - name: Build frontend bundle
        working-directory: vendor/shioaji-pro-app
        run: npm run build

      - name: Install Python package and test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run process restart stream integration twice
        run: |
          python -m pytest tests/integration/test_process_restart_stream.py
          python -m pytest tests/integration/test_process_restart_stream.py

      - name: Run portable source regression
        run: python -m pytest
