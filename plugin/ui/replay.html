<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Money · 真實來源歷史回放</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#091222;color:#dce7f5}*{box-sizing:border-box}body{margin:0;padding:22px;max-width:1536px;margin-inline:auto}a{color:#62c6ff}header{display:flex;gap:20px;align-items:center;justify-content:space-between}h1{font-size:24px;margin:8px 0}.notice{padding:12px;border:1px solid #8e6925;border-radius:9px;background:#2d2517;line-height:1.6}main{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;margin-top:18px}.panel{background:#132035;border:1px solid #2c3e56;border-radius:10px;padding:16px;min-width:0}h2{font-size:18px;margin-top:0}label{display:block;margin:10px 0 4px}input,select,button{width:100%;padding:9px;background:#0c1728;color:#e1edf9;border:1px solid #486480;border-radius:6px}button{background:#075178;cursor:pointer;margin-top:12px}button:disabled{opacity:.5;cursor:wait}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{background:#0b192d;padding:12px;border-radius:7px}.metric span{display:block;font-size:13px;color:#a4bcd5}.metric strong{font-size:22px}.negative{color:#ff8a8a}.positive{color:#83e1b1}small{color:#a4bcd5;line-height:1.6;display:block}#source,#status,#manifest{overflow-wrap:anywhere}#status{margin:10px 0;min-height:22px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:9px 5px;border-bottom:1px solid #2c3e56}.table-wrap{overflow:auto}canvas{width:100%;height:190px;background:#0b192d;border-radius:8px;margin-top:16px}details{margin-top:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto;font-size:11px}#history{max-height:185px;overflow:auto}#history button{text-align:left;font-size:12px;background:#1c3048;margin-top:6px}#result{min-height:390px}@media(max-width:900px){main{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}body{padding:12px}}
</style><script defer src="/static/replay.js"></script></head>
<body><header><h1>Project Money · 真實來源歷史回放</h1><a href="/">返回工作站</a></header>
<div class="notice"><b>歷史研究，不是實盤、CIO 買進指令或持續 PAPER 驗收。</b>凍結 MA 規則；訓練只提供指標暖身，三段測試互不重疊，最終 holdout 不進入前段測試。費用／滑價是假設。負報酬不刪除、不挑選贏家。沒有券商連線。</div>
<main><section class="panel"><h2>來源與凍結參數</h2><label for="symbol">標的／原生幣別</label><select id="symbol"><option value="MSFT">MSFT · USD</option><option value="2330.TW">2330.TW · TWD</option></select><small id="source">讀取真實歷史來源…</small>
<form id="run-form"><label for="cash">每一段獨立虛擬資金（非客戶資產）</label><input id="cash" type="number" min="1" max="100000000" value="100000" required><label for="fast">快線期數</label><input id="fast" type="number" min="2" max="199" value="5" required><label for="slow">慢線期數</label><input id="slow" type="number" min="3" max="200" value="20" required><label for="folds">Walk-forward 段數</label><select id="folds"><option>2</option><option selected>3</option><option>4</option><option>5</option></select><button id="run" type="submit" disabled>執行凍結回放</button></form><div id="status" role="status"></div><small>最終 20% 永不進入開發 folds。每段獨立虛擬餘額，禁止合併成實盤報酬。來源校驗失敗直接停止，不合成替代價格。</small><h2 style="margin-top:22px">保留的歷史執行</h2><div id="history">讀取中…</div></section>
<section id="result" class="panel"><h2>尚無本次結果</h2><p>選擇來源並執行。顯示的是已捕捉的一年日資料，不是即時行情。</p></section></main></body></html>
