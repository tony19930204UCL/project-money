[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cio-market-lab"
version = "0.1.0"
description = "CIO Market Lab - Local Market Engine & Simulation Lab"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Main CIO & Agy Candidate" }
]
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.28.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "yfinance>=0.2.40",
    "exchange-calendars>=4.5,<5"
]

[project.optional-dependencies]
official = ["pypdf==5.9.0"]
test = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cio_market_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests", "strategies"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q --import-mode=importlib -p no:cacheprovider"
